<header class="cs-titlebar">
  <div class="cs-titlebar__cloud" aria-hidden="true">{{ partial "sea-cloud.html" . }}</div>
  <div class="cs-titlebar__inner">
    <a class="cs-titlebar__name" href="{{ "/" | relURL }}" aria-label="C Shells, home"><span class="cs-titlebar__prompt" aria-hidden="true">%</span><span aria-hidden="true"><span class="cs-titlebar__word">sea</span> shells</span><span class="cs-titlebar__cursor" aria-hidden="true"></span></a>
    <nav class="cs-titlebar__nav" aria-label="Main">
      <a href="{{ "posts/" | relURL }}"{{ if eq .Section "posts" }} aria-current="page"{{ end }}>Posts</a>
      <a href="{{ "about/" | relURL }}"{{ if eq .RelPermalink ("about/" | relURL) }} aria-current="page"{{ end }}>About</a>
    </nav>
  </div>
  {{/* A still of the home page scene: the same waves, pier and lighthouse. */}}
  <div class="cs-titlebar__scene" aria-hidden="true">
    <div class="cs-titlebar__sun sun"><svg viewBox="0 0 12 12" shape-rendering="crispEdges"><path fill="currentColor" d="M4 1H8V2H10V4H11V8H10V10H8V11H4V10H2V8H1V4H2V2H4Z"/></svg></div>
    {{ partial "sea-strip.html" . }}
    <div class="cs-titlebar__pier"></div>
    <svg class="cs-titlebar__lighthouse" viewBox="0 0 12 28" shape-rendering="crispEdges">
      <path style="fill:var(--tower-dark)" d="M5 0h2v1h-2zM4 1h4v1h-4zM3 2h6v1h-6zM3 3h1v4h-1zM8 3h1v4h-1zM1 7h10v1h-10zM2 8h8v1h-8z"/>
      <rect style="fill:var(--lamp)" x="4" y="3" width="4" height="4"/>
      <path style="fill:var(--tower-light)" d="M3 9h6v3h-6zM3 15h6v3h-6zM2 21h8v3h-8z"/>
      <path style="fill:var(--tower-dark)" d="M3 12h6v3h-6zM2 18h8v3h-8zM2 24h8v4h-8zM5 16h2v1h-2z"/>
    </svg>
  </div>
</header>
